# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation
#
# Sigul server: holds ALL long-term key material (GnuPG home + SQLite
# DB on the PVC). Single replica by architecture - SQLite, local
# GnuPG home, one persistent bridge connection. Listens on nothing;
# egress-only to the bridge.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sigul.fullname" . }}-server
  labels:
    {{- include "sigul.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  serviceName: {{ include "sigul.fullname" . }}-server
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sigul.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      {{- with (include "sigul.podAnnotations" .) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "sigul.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- include "sigul.imagePullSecrets" . | nindent 6 }}
      # Neither the daemon nor its init containers call the Kubernetes
      # API; they consume mounted Secrets. This pod holds the signing
      # keys, so it carries no cluster credential.
      automountServiceAccountToken: false
      securityContext:
        {{- include "sigul.podSecurityContext" . | nindent 8 }}
      initContainers:
        {{- if .Values.server.persistence.volumePermissions.enabled }}
        # For storage that does not establish ownership itself:
        # local-path/hostpath provisioners, and EFS on a direct
        # mount where root access is preserved. A root-squashed EFS
        # mount or an access point enforces the POSIX identity, so
        # the chown below fails with EPERM and this container blocks
        # the pod in Init:Error. Not needed with the EBS CSI driver,
        # which applies fsGroup - leave it disabled there so the
        # namespace can keep enforcing restricted.
        #
        # Admissible under baseline PodSecurity, but never under
        # restricted. Baseline's capability allow-list includes
        # CHOWN, FOWNER and DAC_OVERRIDE, and baseline places no
        # constraint on runAsUser. Restricted forbids UID 0 and
        # permits adding NET_BIND_SERVICE only, so no capability set
        # brings this container within it - that is the price of
        # storage that does not set ownership, not something to tune.
        #
        # The root mode must be exactly what fsGroup expects (group
        # rwx + setgid). A tighter mode such as 755 leaves the root
        # permanently mismatched, so fsGroupChangePolicy:
        # OnRootMismatch recurses on EVERY mount and re-opens the
        # GnuPG home to the group - sigul then refuses to start with
        # "gnupg home directory is openable by another user", i.e.
        # the server breaks on its first restart.
        - name: volume-permissions
          image: {{ include "sigul.image.server" . }}
          imagePullPolicy: {{ .Values.images.server.pullPolicy }}
          command: ["/bin/bash", "-c", "chown -R 1000:1000 /var/lib/sigul/server && chmod 2775 /var/lib/sigul/server"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # DAC_OVERRIDE: traverse mode-700 dirs owned by 1000
              # (e.g. gnupg) created by earlier runs. It bypasses
              # read, write and execute checks, and for directories
              # execute is the search bit, so it already covers
              # everything the recursive chown needs to walk.
              #
              # DAC_READ_SEARCH deliberately absent: it grants a
              # strict subset of that for this workload, and it is
              # the one capability here outside baseline PSS's
              # allow-list. Adding it back buys nothing and costs
              # the whole baseline profile.
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/sigul/server
        {{- end }}
        # Gate on bridge READINESS without opening any TCP connection:
        # the headless Service's DNS records exist only while the
        # bridge pod is Ready (its probes are exec-based). A bare TCP
        # probe here would disrupt the bridge's serial accept loop
        # (accepted connections trigger an immediate TLS handshake).
        # The image entrypoint resolves rather than connects too, but
        # against BRIDGE_HOSTNAME below - the ClusterIP Service, whose
        # DNS answers whether or not the bridge is Ready. So readiness
        # is gated here and only here; the entrypoint's check catches a
        # misconfigured hostname and nothing more.
        - name: wait-for-bridge
          image: {{ include "sigul.image.server" . }}
          imagePullPolicy: {{ .Values.images.server.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              for i in $(seq 1 90); do
                if getent hosts {{ include "sigul.bridge.headlessServiceName" . }} >/dev/null 2>&1; then
                  echo "bridge is Ready (headless DNS resolves)"; exit 0
                fi
                echo "waiting for bridge readiness ($i/90)"; sleep 2
              done
              echo "bridge never became Ready" >&2; exit 1
          securityContext:
            {{- include "sigul.containerSecurityContext" . | nindent 12 }}
        - name: nss-init
          image: {{ include "sigul.image.server" . }}
          imagePullPolicy: {{ .Values.images.server.pullPolicy }}
          command: ["/bin/bash", "/scripts/nss-init.sh"]
          securityContext:
            {{- include "sigul.containerSecurityContext" . | nindent 12 }}
          env:
            - name: SIGUL_ROLE
              value: server
            - name: NSS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sigul.secret.passwords" . }}
                  key: server-nss-password
            - name: P12_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sigul.secret.passwords" . }}
                  key: p12-password
            - name: BRIDGE_HOSTNAME
              value: {{ include "sigul.bridge.serviceName" . | quote }}
            - name: BRIDGE_PORT
              value: {{ .Values.bridge.ports.server | quote }}
            - name: LENIENT_USERNAME_CHECK
              value: {{ .Values.server.lenientUsernameCheck | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: conf-templates
              mountPath: /conf-templates
              readOnly: true
            - name: pki-input
              mountPath: /pki-input
              readOnly: true
            - name: nss
              mountPath: /nss-out
            - name: config
              mountPath: /config-out
            - name: tmp
              mountPath: /tmp
        # First-boot schema + administrator creation, deliberately NOT
        # left to the image entrypoint: it warns rather than fails when
        # sigul_server_add_admin errors, and its "already initialized"
        # branch means the administrator is never retried. Failing here
        # keeps the daemon from starting without one, and confines the
        # admin credential to this container.
        - name: db-init
          image: {{ include "sigul.image.server" . }}
          imagePullPolicy: {{ .Values.images.server.pullPolicy }}
          command: ["/bin/bash", "/scripts/db-init.sh"]
          securityContext:
            {{- include "sigul.containerSecurityContext" . | nindent 12 }}
          env:
            - name: SIGUL_ADMIN_USER
              value: {{ include "sigul.server.adminUser" . | quote }}
            - name: SIGUL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sigul.secret.admin" . }}
                  key: admin-password
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            # Mounted at /var/lib/sigul/server, NOT at /var/lib/sigul,
            # because that path is the image's WORKDIR
            # (Dockerfile.server). Keep the two equal.
            #
            # A container's working directory has to exist, so the
            # runtime creates it when it does not - as root, mode 0755,
            # after fsGroup has already run. Mount the volume at the
            # WORKDIR's parent and that mkdir lands ON the volume:
            # /var/lib/sigul/server appears root-owned and not
            # group-writable, and this pod cannot write into it. That is
            # what killed db-init while it created the GnuPG home.
            # Mounting AT the WORKDIR means the directory already exists
            # when the runtime looks, so nothing is created and fsGroup
            # has made the mount root group-writable.
            #
            # Verified rather than assumed: the same image with
            # workingDir overridden to / leaves the volume empty, and
            # busybox - which has nothing at this path - creates a
            # root-owned server/ when its workingDir is set here. The
            # image's content is irrelevant; the working directory is
            # what decides. Kubernetes hides image content under a
            # mount, it does not copy it.
            #
            # Docker hides the whole problem, which is why the compose
            # stack is unaffected: it runs the same image with the same
            # WORKDIR, but its named-volume copy seeds the volume from
            # the image and preserves ownership.
            #
            # So if Dockerfile.server's WORKDIR ever moves, this mount
            # moves with it. Do not "tidy" this to /var/lib/sigul, and
            # do not move the paths in files/conf/server.conf.template
            # instead: the image entrypoint prepares its own GnuPG
            # directory from a hard-coded path before the daemon
            # launches, so it would still look here, fail while
            # preparing it, and never reach the daemon - after db-init
            # had already reported success.
            - name: data
              mountPath: /var/lib/sigul/server
            - name: nss
              mountPath: /etc/pki/sigul/server
            - name: config
              mountPath: /etc/sigul
              readOnly: true
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
      containers:
        - name: server
          image: {{ include "sigul.image.server" . }}
          imagePullPolicy: {{ .Values.images.server.pullPolicy }}
          # Runs as UID 1000: entrypoint's non-root branch handles DB
          # init + admin creation on first boot, then exec's
          # sigul_server directly.
          command: ["/usr/local/bin/entrypoint.sh"]
          securityContext:
            {{- include "sigul.containerSecurityContext" . | nindent 12 }}
          env:
            - name: SIGUL_ROLE
              value: server
            # SIGUL_ADMIN_USER only: by the time this container runs,
            # db-init has created the database, so the entrypoint takes
            # its "already initialized" path and never needs the
            # credential. Keeping the password out of the long-running
            # daemon means a compromise of it cannot read an
            # administrator credential from the environment.
            - name: SIGUL_ADMIN_USER
              value: {{ include "sigul.server.adminUser" . | quote }}
          # No ports: the server listens on nothing.
          # startupProbe holds liveness off through the entrypoint's
          # bridge-wait + first-boot DB/admin initialization (up to
          # 5 min) - without it, liveness SIGKILLs the container
          # before sigul_server ever spawns (observed exit 137).
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                # Anchored to the daemon's script path: the bracket
                # defeats pgrep -f matching this probe's own command
                # line, and the \.py suffix excludes the first-boot
                # helpers (server_create_db.py, server_add_admin.py)
                # whose names contain the daemon prefix.
                #
                # And its heartbeat exists: the daemon writes it as soon
                # as it starts supervising, so its absence means the
                # daemon never got that far.
                - "pgrep -f '/usr/share/sigul/serve[r]\\.py' >/dev/null && test -e /run/sigul_server.heartbeat"
            periodSeconds: 5
            failureThreshold: 60
          # Liveness reads the daemon's heartbeat (patch 19), not a
          # process or a socket: a frozen server keeps both, and stayed
          # Ready for four minutes and was replaced only after about five
          # and a half (#33). The supervising parent rewrites it once a
          # second, and withholds it while its request child is stopped,
          # or has held no connection to the bridge for fifty seconds.
          #
          # That second condition is the backstop this probe used to be,
          # by checking for an established connection directly. When a
          # double-TLS teardown wedged, every process was still present -
          # blocked in waitpid() and poll() - while nothing reconnected;
          # observed in production for six hours. patches/06 removes the
          # known cause; the heartbeat still catches the rest within the
          # two minutes that check took - fifty seconds disconnected, a
          # second to withhold the beat, thirty for it to go stale and
          # three failures ten seconds apart, 111 s at worst - and now
          # also catches a frozen server, which kept its connection.
          # test/test_server_heartbeat.py holds these numbers to that.
          #
          # Thirty seconds is thirty missed beats. Three failures ten
          # seconds apart then restart it. Bounded below as well as
          # above, as for the bridge: after the clock steps backwards
          # the heartbeat is dated in the future, and an upper bound
          # alone would pass a wedged daemon until real time caught up.
          livenessProbe:
            exec:
              command: ["/bin/bash", "-c", "a=$(( $(date +%s) - $(stat -c %Y /run/sigul_server.heartbeat) )) && test $a -ge -5 && test $a -le 30"]
            periodSeconds: 10
            failureThreshold: 3
          # Truest readiness signal: an ESTABLISHED connection to the
          # bridge's server-facing port.
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                # -H suppresses the header line, which would otherwise
                # satisfy grep even with no matching socket. A fresh
                # heartbeat too, so a frozen server stops receiving
                # traffic as soon as it stops beating.
                - "ss -Htn state established '( dport = :{{ .Values.bridge.ports.server }} )' | grep -q . && a=$(( $(date +%s) - $(stat -c %Y /run/sigul_server.heartbeat) )) && test $a -ge -5 && test $a -le 30"
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/sigul/server
            - name: nss
              mountPath: /etc/pki/sigul/server
            - name: config
              mountPath: /etc/sigul
              readOnly: true
            - name: run
              mountPath: /run
            - name: var-log
              mountPath: /var/log
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: scripts
          configMap:
            name: {{ include "sigul.fullname" . }}-scripts
            defaultMode: 0555
        - name: conf-templates
          configMap:
            name: {{ include "sigul.fullname" . }}-conf-templates
        - name: pki-input
          projected:
            sources:
              - secret:
                  name: {{ include "sigul.secret.caPublic" . }}
              - secret:
                  name: {{ include "sigul.secret.serverP12" . }}
                  items:
                    - key: server.p12
                      path: server.p12
        - name: nss
          emptyDir: {}
        - name: config
          emptyDir:
            medium: Memory
        - name: run
          emptyDir: {}
        - name: var-log
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        # Deliberately NOT sigul.labels: it embeds chart/app versions,
        # and volumeClaimTemplates are immutable - version bumps would
        # make every upgrade fail. Stable identity labels only.
        labels:
          app.kubernetes.io/name: {{ include "sigul.name" . }}
          app.kubernetes.io/instance: {{ .Release.Name }}
          app.kubernetes.io/component: server
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with include "sigul.server.storageClassName" . }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.server.persistence.size }}
